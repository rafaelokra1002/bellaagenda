# PostgreSQL para desenvolvimento local. Não use estas credenciais em produção.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bella
      POSTGRES_PASSWORD: bella_dev_password
      POSTGRES_DB: bellaagenda
    ports:
      - "5433:5432"
    volumes:
      - bellaagenda_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bella -d bellaagenda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bellaagenda_pg:
